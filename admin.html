<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración Municipal</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen">
  <header class="encabezado text-white">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <p class="uppercase tracking-widest text-blue-200 text-xs font-semibold">Municipalidad · Uso interno</p>
        <h1 class="text-2xl md:text-3xl font-bold">Panel de Administración de Quejas</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="ultima-actualizacion" class="text-xs text-blue-100"></span>
        <button id="btn-actualizar" class="bg-white/15 hover:bg-white/25 rounded-lg px-4 py-2 text-sm font-semibold">↻ Actualizar</button>
        <a href="index.html" class="bg-white text-blue-800 hover:bg-blue-50 rounded-lg px-4 py-2 text-sm font-semibold">Portal ciudadano</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <div id="alerta" class="hidden rounded-lg px-4 py-3 text-sm" role="alert"></div>

    <!-- Métricas -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl shadow p-5">
        <p class="text-sm text-slate-500">Total de quejas</p>
        <p id="m-total" class="text-3xl font-bold text-slate-800">–</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5">
        <p class="text-sm text-slate-500">Registradas hoy</p>
        <p id="m-hoy" class="text-3xl font-bold text-blue-700">–</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5">
        <p class="text-sm text-slate-500">Últimos 7 días</p>
        <p id="m-7dias" class="text-3xl font-bold text-emerald-700">–</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5">
        <p class="text-sm text-slate-500">Anónimas</p>
        <p id="m-anonimas" class="text-3xl font-bold text-amber-600">–</p>
      </div>
    </section>

    <section class="bg-white rounded-xl shadow p-5">
      <h2 class="font-semibold text-slate-800 mb-4">Quejas por categoría</h2>
      <div id="grafica-categorias" class="space-y-3"></div>
    </section>

    <!-- Filtros -->
    <section class="bg-white rounded-xl shadow p-5">
      <form id="form-filtros" class="grid gap-4 md:grid-cols-5 items-end">
        <div class="md:col-span-2">
          <label for="f-busqueda" class="block text-sm font-medium text-slate-700 mb-1">Buscar</label>
          <input id="f-busqueda" type="search" class="campo" placeholder="ID, descripción, ubicación, nombre…" />
        </div>
        <div>
          <label for="f-categoria" class="block text-sm font-medium text-slate-700 mb-1">Categoría</label>
          <select id="f-categoria" class="campo"><option value="">Todas</option></select>
        </div>
        <div>
          <label for="f-desde" class="block text-sm font-medium text-slate-700 mb-1">Desde</label>
          <input id="f-desde" type="date" class="campo" />
        </div>
        <div>
          <label for="f-hasta" class="block text-sm font-medium text-slate-700 mb-1">Hasta</label>
          <input id="f-hasta" type="date" class="campo" />
        </div>
        <div class="md:col-span-5 flex flex-wrap items-center justify-between gap-3">
          <p id="resumen-filtro" class="text-sm text-slate-500"></p>
          <button type="button" id="btn-limpiar" class="text-sm text-blue-700 hover:underline">Limpiar filtros</button>
        </div>
      </form>
    </section>

    <!-- Listado -->
    <section>
      <div id="cargando" class="hidden text-center text-slate-500 py-10">Cargando quejas…</div>
      <div id="vacio" class="hidden bg-white rounded-xl shadow text-center text-slate-500 py-12">No hay quejas que coincidan con los filtros.</div>
      <div id="lista-quejas" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
    </section>
  </main>

  <!-- Modal de detalle -->
  <div id="modal" class="hidden fixed inset-0 z-50 modal-fondo flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b px-6 py-4">
        <h3 id="modal-titulo" class="font-mono font-bold text-blue-800"></h3>
        <button id="modal-cerrar" class="text-slate-500 hover:text-slate-800 text-2xl leading-none" aria-label="Cerrar">&times;</button>
      </div>
      <div id="modal-contenido" class="p-6"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
