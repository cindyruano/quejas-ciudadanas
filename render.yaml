services:
  - type: web
    name: quejas-ciudadanas
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGINS
        value: https://cindyruano.github.io,http://127.0.0.1:5500,http://localhost:5500
      - key: MAX_FILE_MB
        value: 5
      - key: CATEGORIAS
        value: Alumbrado público,Baches y calles,Recolección de basura,Agua y drenaje,Seguridad,Parques y áreas verdes,Ruido,Otro
      - key: FIRESTORE_COLLECTION_QUEJAS
        value: quejas
      - key: FIRESTORE_COLLECTION_IMAGENES
        value: imagenes
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
